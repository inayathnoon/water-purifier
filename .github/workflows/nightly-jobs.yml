name: Nightly jobs

on:
  schedule:
    # 02:00 UTC nightly — after the business day ends, before it starts again.
    - cron: '0 2 * * *'
  workflow_dispatch: {} # allows a manual "Run workflow" from the Actions tab

jobs:
  # §8.2's yearly-service check used to run here nightly, auto-creating a
  # follow-up ticket. Retired (2026-09-02): due-ness is now a plain
  # read-time query (getYearlyServiceDueThisMonth) shown on
  # /admin/service-calls, and creating the actual ticket is an explicit
  # admin action — nothing needs to run in the background for it any more.

  product-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync products from spreadsheet (§9.2)
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" -X POST \
            "${{ secrets.APP_URL }}/api/jobs/product-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/body
          if [ "$response" -ge 300 ]; then
            # §9.6: fail loudly — a non-zero exit here fails the whole
            # workflow run, which GitHub surfaces in the Actions tab.
            echo "Product sync failed with HTTP $response"
            exit 1
          fi
